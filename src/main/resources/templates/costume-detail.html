<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>รายละเอียดชุดเช่า</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container my-5">
    <div class="row" th:object="${costume}">
        <div class="col-md-5">
            <img th:src="*{imageUrl != null ? imageUrl : 'https://via.placeholder.com/400x300'}" class="img-fluid rounded" alt="Costume">
        </div>
        <div class="col-md-7">
            <h2 th:text="*{name}">ชื่อชุด</h2>
            <hr>
            <p><strong>หมวดหมู่:</strong> <span th:text="*{category}">-</span></p>
            <p><strong>ไซส์:</strong> <span th:text="*{size}">-</span></p>
            <p><strong>รายละเอียด:</strong> <span th:text="*{description}">-</span></p>
            <p><strong>ค่าเช่าต่อวัน:</strong> <span class="text-primary fs-4" th:text="*{rentalPricePerDay}">0</span> บาท</p>
            <p><strong>ค่าประกันชุด:</strong> <span class="text-danger fs-5" th:text="*{depositPrice}">0</span> บาท</p>
            
            <a th:if="*{status == 'AVAILABLE'}" th:href="@{/rentals/new/{id}(id=*{id})}" class="btn btn-success btn-lg mt-3">ดำเนินการเช่าชุด</a>
            <button th:if="*{status != 'AVAILABLE'}" class="btn btn-secondary btn-lg mt-3" disabled>ชุดนี้ถูกเช่าอยู่</button>
            <a href="/" class="btn btn-outline-secondary btn-lg mt-3 ms-2">ย้อนกลับ</a>
        </div>
    </div>
</div>
</body>
</html>
