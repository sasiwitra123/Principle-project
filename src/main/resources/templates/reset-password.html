<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตั้งรหัสผ่านใหม่ - Costume Rental System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #ffebee 0%, #f8f9fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Prompt', sans-serif;
        }
        .card-custom {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(211, 47, 47, 0.15);
            max-width: 420px;
            width: 100%;
            background: #ffffff;
        }
        .btn-red {
            background-color: #d32f2f;
            color: #fff;
            border: none;
        }
        .btn-red:hover {
            background-color: #9a0007;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container p-3">
        <div class="card card-custom mx-auto p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="text-danger fs-1 mb-2">
                    <i class="bi bi-shield-lock"></i>
                </div>
                <h4 class="fw-bold text-dark mb-1">ตั้งรหัสผ่านใหม่</h4>
                <p class="text-muted small">สำหรับผู้ใช้งาน: <span class="fw-bold text-danger" th:text="${username}">User</span></p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small text-center rounded-3 mb-3" th:text="${error}"></div>

            <form th:action="@{/reset-password}" method="post">
                <input type="hidden" name="username" th:value="${username}">

                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">รหัสผ่านใหม่</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-danger"></i></span>
                        <input type="password" name="newPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-secondary">ยืนยันรหัสผ่านใหม่</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-check-circle text-danger"></i></span>
                        <input type="password" name="confirmPassword" class="form-control bg-light border-start-0" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-red w-100 rounded-pill py-2 fw-bold mb-3">
                    <i class="bi bi-save me-1"></i> บันทึกรหัสผ่านใหม่
                </button>
            </form>
        </div>
    </div>

</body>
</html>
