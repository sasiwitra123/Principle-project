<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ลืมรหัสผ่าน - Costume Rental System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container d-flex justify-content-center">
        <div class="card shadow border-0 w-100" style="max-width: 420px; border-radius: 15px;">
            <div class="card-header bg-danger text-white text-center py-4" style="border-radius: 15px 15px 0 0;">
                <i class="bi bi-key-fill fs-1"></i>
                <h4 class="fw-bold mt-2 mb-1">ลืมรหัสผ่าน</h4>
                <p class="small mb-0" th:text="${otpSent == true} ? 'กรอก OTP และรหัสผ่านใหม่' : 'กรอกอีเมลเพื่อขอรับรหัส OTP'"></p>
            </div>

            <div class="card-body p-4">
                <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                <div th:if="${message}" class="alert alert-success py-2 small" th:text="${message}"></div>

                <!-- ขั้นตอนที่ 1: กรอกอีเมลรับ OTP -->
                <form th:if="${otpSent != true}" th:action="@{/forgot-password/send-otp}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">อีเมลที่ใช้ลงทะเบียน</label>
                        <input type="email" name="email" class="form-control" placeholder="example@email.com" th:value="${email}" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">ส่งรหัส OTP ไปยังอีเมล</button>
                </form>

                <!-- ขั้นตอนที่ 2: กรอก OTP และตั้งรหัสผ่านใหม่ -->
                <form th:if="${otpSent == true}" th:action="@{/forgot-password/reset}" method="post">
                    <!-- 🟢 เพิ่ม Hidden Field สำหรับแนบ Email ส่งไปยืนยันการตั้งรหัสผ่านใหม่ -->
                    <input type="hidden" name="email" th:value="${email}">

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">รหัส OTP (เช็คในอีเมล)</label>
                        <input type="text" name="otp" class="form-control text-center fs-5" placeholder="กรอกรหัส 6 หลัก" maxlength="6" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-secondary">กำหนดรหัสผ่านใหม่</label>
                        <input type="password" name="newPassword" class="form-control" placeholder="ตั้งรหัสผ่านใหม่อย่างน้อย 6 ตัวอักษร" minlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">บันทึกรหัสผ่านใหม่</button>
                </form>

                <div class="text-center mt-3">
                    <!-- 🟢 ใช้ th:href แทน href ปกติ -->
                    <a th:href="@{/login}" class="text-decoration-none small text-secondary">← กลับไปยังหน้าเข้าสู่ระบบ</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
