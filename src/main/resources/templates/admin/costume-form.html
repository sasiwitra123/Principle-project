<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เพิ่มชุดเช่าใหม่</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .upload-box {
            border: 2px dashed #cbd5e1;
            background-color: #f8fafc;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .upload-box:hover {
            border-color: #198754;
            background-color: #f1f9f5;
        }
    </style>
</head>
<body class="bg-light">
<div class="container my-5" style="max-width: 650px;">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-success text-white py-3">
            <h4 class="mb-0 fs-5 fw-bold"><i class="bi bi-plus-circle me-2"></i>เพิ่มข้อมูลชุดเช่าใหม่</h4>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/costumes/save}" th:object="${costume}" method="post" enctype="multipart/form-data">
                
                <!-- ชื่อชุด -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">ชื่อชุดเช่า <span class="text-danger">*</span></label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="เช่น ชุดไทยจักรพรรดิสีแดง" required />
                </div>

                <div class="row">
                    <!-- หมวดหมู่ -->
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label fw-bold">หมวดหมู่ <span class="text-danger">*</span></label>
                        <select id="category" th:field="*{category}" class="form-select" required>
                            <option value="ชุดไทย">ชุดไทย</option>
                            <option value="ชุดสูท">ชุดสูท</option>
                            <option value="ชุดราตรี">ชุดราตรี</option>
                            <option value="ชุดแฟนซี">ชุดแฟนซี</option>
                            <option value="อื่น ๆ">อื่น ๆ</option>
                        </select>
                    </div>
                    
                    <!-- ค่าเช่าต่อวัน -->
                    <div class="col-md-6 mb-3">
                        <label for="price" class="form-label fw-bold">ค่าเช่าต่อวัน (บาท) <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="price" th:field="*{price}" class="form-control" placeholder="800.00" required />
                    </div>
                </div>

                <!-- 🟢 ช่องกรอกรายละเอียดเพิ่มเติม -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-bold">รายละเอียดเพิ่มเติม</label>
                    <textarea id="description" th:field="*{description}" class="form-control" rows="3" placeholder="เช่น ไซส์ M-L, รวมเครื่องประดับ 3 ชิ้น, เหมาะสำหรับงานราตรี..."></textarea>
                </div>

                <!-- กล่องอัปโหลดรูปภาพ -->
                <div class="mb-3">
                    <label class="form-label fw-bold">รูปภาพชุดเช่า</label>
                    
                    <div class="upload-box text-center p-4 position-relative" id="drop-zone" onclick="document.getElementById('imageFile').click()">
                        <!-- ตัวอย่างรูปภาพเมื่อเลือกไฟล์แล้ว -->
                        <div id="preview-container" class="d-none mb-2">
                            <img id="image-preview" src="#" alt="ตัวอย่างรูปภาพ" class="img-fluid rounded shadow-sm" style="max-height: 220px; object-fit: cover;">
                        </div>

                        <!-- ข้อความแนะนำอัปโหลด -->
                        <div id="upload-placeholder">
                            <i class="bi bi-cloud-arrow-up display-4 text-success mb-2 d-block"></i>
                            <span class="fw-bold text-dark d-block">คลิกที่นี่เพื่อเลือกรูปภาพ</span>
                            <small class="text-muted">รองรับไฟล์ JPG, PNG, WEBP</small>
                        </div>
                    </div>

                    <!-- Input สำหรับเลือกไฟล์จริง (ซ่อนไว้) -->
                    <input type="file" id="imageFile" name="imageFile" accept="image/*" class="d-none" onchange="previewImage(event)">
                </div>

                <!-- สถานะเริ่มต้น -->
                <div class="mb-4">
                    <label for="status" class="form-label fw-bold">สถานะเริ่มต้น</label>
                    <select id="status" th:field="*{status}" class="form-select">
                        <option value="ว่าง">ว่าง</option>
                        <option value="ติดจอง">ติดจอง</option>
                        <option value="ส่งซัก">ส่งซัก</option>
                        <option value="รอคืน">รอคืน</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-2">
                    <i class="bi bi-check-circle me-1"></i>บันทึกข้อมูลชุด
                </button>
                <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary w-100">ยกเลิก</a>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('image-preview');
        const previewContainer = document.getElementById('preview-container');
        const placeholder = document.getElementById('upload-placeholder');

        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                previewContainer.classList.remove('d-none');
                placeholder.classList.add('d-none');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>
</body>
</html>
