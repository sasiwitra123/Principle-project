<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - COSTUME RENTAL</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 440px;
            border-radius: 1rem;
        }
        .brand-header {
            background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%);
            border-top-left-radius: 1rem;
            border-top-right-radius: 1rem;
        }
        .role-btn-check:checked + .btn-outline-danger {
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <div class="card login-card shadow-lg border-0 m-3">
        <!-- Header -->
        <div class="brand-header text-white text-center p-4">
            <i class="bi bi-bag-heart-fill display-4 mb-2 d-inline-block"></i>
            <h4 class="fw-bold mb-1">COSTUME RENTAL</h4>
            <p class="small text-white-50 mb-0">ระบบบริการเช่าชุดออนไลน์</p>
        </div>

        <div class="card-body p-4">
            
            <!-- 1. แจ้งเตือนเมื่อสมัครสมาชิกสำเร็จ -->
            <div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบ
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 2. แจ้งเตือนเมื่อเปลี่ยนรหัสผ่านสำเร็จ -->
            <div th:if="${param.resetSuccess}" class="alert alert-success alert-dismissible fade show small" role="alert">
                <i class="bi bi-check-circle-fill me-1"></i> รีเซ็ตรหัสผ่านสำเร็จ! กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 3. เพิ่มใหม่: แจ้งเตือนเมื่อออกจากระบบสำเร็จ -->
            <div th:if="${param.logout}" class="alert alert-info alert-dismissible fade show small" role="alert">
                <i class="bi bi-info-circle-fill me-1"></i> ออกจากระบบเรียบร้อยแล้ว
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- 4. ปรับปรุง: แจ้งเตือนเมื่อเข้าสู่ระบบไม่สำเร็จ (รองรับทั้ง Model attribute และ URL param) -->
            <div th:if="${error != null or param.error != null}" class="alert alert-danger alert-dismissible fade show small" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> 
                <span th:text="${error != null ? error : 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form th:action="@{/login}" method="post">

                <!-- ตัวเลือกประเภทผู้ใช้ (USER / ADMIN) -->
                <div class="mb-3">
                    <label class="form-label fw-bold small text-secondary d-block">ประเภทผู้ใช้งาน</label>
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check role-btn-check" name="role" id="roleUser" value="USER" checked>
                        <label class="btn btn-outline-danger btn-sm py-2" for="roleUser">
                            <i class="bi bi-person-fill me-1"></i> ผู้ใช้งานทั่วไป (User)
                        </label>

                        <input type="radio" class="btn-check role-btn-check" name="role" id="roleAdmin" value="ADMIN">
                        <label class="btn btn-outline-danger btn-sm py-2" for="roleAdmin">
                            <i class="bi bi-shield-lock-fill me-1"></i> ผู้ดูแลระบบ (Admin)
                        </label>
                    </div>
                </div>

                <!-- Username / Email -->
                <div class="mb-3">
                    <label for="username" class="form-label fw-bold small text-secondary">
                        <i class="bi bi-envelope-fill me-1"></i> อีเมล
                    </label>
                    <input type="email" 
                           class="form-control form-control-lg fs-6" 
                           id="username" 
                           name="username" 
                           placeholder="example@email.com"
                           required 
                           autofocus>
                </div>

                <!-- Password -->
                <div class="mb-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <label for="password" class="form-label fw-bold small text-secondary mb-0">
                            <i class="bi bi-lock-fill me-1"></i> รหัสผ่าน
                        </label>
                        <!-- ปรับเป็น th:href -->
                        <a th:href="@{/forgot-password}" class="small text-danger text-decoration-none">ลืมรหัสผ่าน?</a>
                    </div>
                    <input type="password" 
                           class="form-control form-control-lg fs-6 mt-1" 
                           id="password" 
                           name="password" 
                           placeholder="กรอกรหัสผ่าน" 
                           required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-danger btn-lg w-100 rounded-pill fs-6 fw-bold shadow-sm my-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> เข้าสู่ระบบ
                </button>
            </form>

            <!-- สมัครสมาชิก -->
            <div class="text-center pt-2 border-top">
                <span class="small text-muted">ยังไม่มีบัญชีผู้ใช้งาน?</span>
                <!-- ปรับเป็น th:href -->
                <a th:href="@{/register}" class="small fw-bold text-danger text-decoration-none ms-1">
                    สมัครสมาชิกใหม่
                </a>
            </div>
        </div>

        <div class="card-footer bg-light text-center py-3 rounded-bottom border-0">
            <small class="text-muted">© 2026 Costume Rental System. All rights reserved.</small>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
