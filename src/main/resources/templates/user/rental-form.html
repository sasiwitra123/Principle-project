<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>แบบฟอร์มการเช่าชุด</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container my-5" style="max-width: 600px;">
    <h2>แบบฟอร์มยืนยันการเช่าชุด</h2>
    <div class="alert alert-info" th:object="${costume}">
        <strong th:text="*{name}">ชื่อชุด</strong> | ค่าเช่า: <span th:text="*{rentalPricePerDay}">0</span> บ./วัน | มัดจำ: <span th:text="*{depositPrice}">0</span> บ.
    </div>

    <form th:action="@{/rentals/create}" th:object="${rental}" method="post">
        <input type="hidden" name="costumeId" th:value="${costume.id}" />

        <div class="mb-3">
            <label class="form-label">ชื่อผู้เช่า:</label>
            <input type="text" th:field="*{customerName}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">เบอร์โทรศัพท์:</label>
            <input type="tel" th:field="*{customerPhone}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">วันที่เริ่มเช่า:</label>
            <input type="date" th:field="*{startDate}" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">วันที่กำหนดคืน:</label>
            <input type="date" th:field="*{endDate}" class="form-control" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">ยืนยันการเช่า</button>
        <a href="/" class="btn btn-link w-100 mt-2 text-secondary">ยกเลิก</a>
    </form>
</div>
</body>
</html>
