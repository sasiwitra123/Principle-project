<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>รายการเช่าของฉัน</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Costume Rental</a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm">หน้าหลัก</a>
        </div>
    </div>
</nav>

<div class="container my-4">
    <h2>ประวัติและสถานะการเช่าของฉัน</h2>
    <div class="table-responsive mt-3">
        <table class="table table-bordered table-hover">
            <thead class="table-dark">
                <tr>
                    <th>รหัสรายการ</th>
                    <th>ชุดที่เช่า</th>
                    <th>วันที่เริ่มเช่า</th>
                    <th>กำหนดวันคืน</th>
                    <th>ค่าเช่ารวม (บาท)</th>
                    <th>เงินมัดจำ (บาท)</th>
                    <th>สถานะ</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="rental : ${rentals}">
                    <td th:text="${rental.id}">1</td>
                    <td th:text="${rental.costume.name}">ชุดไทยโบราณ</td>
                    <td th:text="${rental.startDate}">2026-09-20</td>
                    <td th:text="${rental.endDate}">2026-09-23</td>
                    <td th:text="${rental.totalRentalFee}">1500.00</td>
                    <td th:text="${rental.depositAmount}">500.00</td>
                    <td>
                        <span class="badge bg-primary" th:if="${rental.status == 'ACTIVE'}">กำลังเช่า</span>
                        <span class="badge bg-success" th:if="${rental.status == 'RETURNED'}">คืนแล้ว</span>
                        <span class="badge bg-danger" th:if="${rental.status == 'OVERDUE'}">เกินกำหนด</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(rentals)}">
                    <td colspan="7" class="text-center text-muted">ยังไม่มีรายการเช่า</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
