spring.application.name=costumerentalsystem
server.port=8081

# 🔵 PostgreSQL Database Configuration (เชื่อมต่อกับ database: principlesproject)
spring.datasource.url=jdbc:postgresql://localhost:5432/principlesproject
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=punch2548

# JPA / Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Thymeleaf Cache
spring.thymeleaf.cache=false

# File Upload Settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# 🟢 ตั้งค่า Mail โดยดึงค่าจาก Environment Variables
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true